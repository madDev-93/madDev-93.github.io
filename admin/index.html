<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Qwota Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232dd4a7'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='20' font-weight='bold' text-anchor='middle' fill='%2304120d'%3EQ%3C/text%3E%3C/svg%3E" />
  <!-- ?v= is bumped on every admin.css/admin.js change. GitHub Pages serves these
         with cache-control: max-age=600, so without it a console left open before a
         deploy keeps running the old code for ten minutes and a shipped fix looks
         like it never landed. -->
    <link rel="stylesheet" href="admin.css?v=20260801m" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
</head>
<body>
  <!-- Sign-in gate -->
  <div id="signin" class="signin">
    <div class="signin-card">
      <div class="signin-logo">Q</div>
      <h1>Qwota Admin</h1>
      <p>Sign in to access the console</p>
      <button id="signin-btn" class="btn-google">
        <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#4285F4" d="M45 24c0-1.6-.1-3.1-.4-4.6H24v9.1h11.8c-.5 2.8-2 5.1-4.4 6.7v5.6h7.1C42.7 37 45 31 45 24z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.6c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.2H4.3v5.8C7.9 41.1 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.6 27.9c-.5-1.3-.7-2.7-.7-4.1s.3-2.8.7-4.1v-5.8H4.3C2.8 16.9 2 20.3 2 23.8s.8 6.9 2.3 9.9l7.3-5.8z"/><path fill="#EA4335" d="M24 10.7c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C34.9 4 30 2 24 2 15.4 2 7.9 6.9 4.3 14l7.3 5.8c1.7-5.3 6.6-9.1 12.4-9.1z"/></svg>
        Sign in with Google
      </button>
      <p id="signin-error" class="signin-error"></p>
    </div>
  </div>

  <!-- App shell -->
  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <div class="brand"><div class="logo">Q</div><div><div class="brand-name">Qwota Admin</div><div class="brand-sub" id="updated">loading…</div></div></div>
      <div class="topbar-right">
        <button class="pill" id="internal-toggle" title="Include internal / test accounts">Real users only</button>
        <span class="status" id="status"><span class="pulse"></span> <span id="status-text">checking…</span></span>
        <button class="icon-btn" id="refresh" title="Refresh">↻</button>
        <button class="icon-btn" id="signout" title="Sign out">⏻</button>
      </div>
    </header>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-tab="cockpit">Cockpit</button>
      <button class="nav-item" data-tab="money">Money</button>
      <button class="nav-item" data-tab="users">Users</button>
      <button class="nav-item" data-tab="push">Push</button>
      <button class="nav-item" data-tab="health">Health</button>
    </nav>
    <main class="main" id="main"><div class="loading">Loading console…</div></main>
  </div>

  <!-- Action modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span id="modal-title">Action</span><button class="icon-btn" id="modal-close">✕</button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="admin.js?v=20260829b"></script>
</body>
</html>
